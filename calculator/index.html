<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Calculator -->

    <div class="calculator">

    <h1 class="title">Smart Calculator</h1>

    <input type="text" id="display" readonly>

    <div class="buttons">

            <button class="operator" onclick="clearDisplay()">
                AC
            </button>

            <button class="operator" onclick="deleteLast()">
                DE
            </button>

            <button class="operator" onclick="appendValue('%')">
                %
            </button>

            <button class="operator" onclick="appendValue('/')">
                ÷
            </button>

            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button class="operator" onclick="appendValue('*')">
                ×
            </button>

            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button class="operator" onclick="appendValue('-')">
                −
            </button>

            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button class="operator" onclick="appendValue('+')">
                +
            </button>

            <button onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button class="equal-btn" onclick="calculate()">
                =
            </button>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
